<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>mtrang's music player</title>
<link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="log-in-page">
       <img class="sky-bg1" src="assets/sky-bg1.svg" alt="Sky Background">
       <img class="pfp" src="assets/pfp.svg" alt="Profile Picture">
       <img class="password" src="assets/password.svg" alt="Password">
       <input class="password-input" type="password" id="password-input" aria-label="Password" autocomplete="off" autofocus>
       <img class="enter-btn" id="enter-btn" src="assets/enter-btn.svg" alt="Enter Button" role="button" tabindex="0" draggable="false">
       <p class="logging-in"> logging in...</p>
       <p class="user"> user: mtrang</p>
       <p class="hint"> hint: enter anything </p>
    </div>

    <script src="login.js"></script>
</body>
</html>
